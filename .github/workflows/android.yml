name: Android 离线应用构建
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Matches android/app/build.gradle.kts; override the action's obsolete "tools" default.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: 构建 APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug
      - name: 验证安装包签名
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'
      - name: 整理安装包
        run: |
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/local-fitness-1.0.0-debug.apk
          cd ../release
          sha256sum local-fitness-1.0.0-debug.apk > local-fitness-1.0.0-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: local-fitness-debug-apk
          path: |
            release/local-fitness-1.0.0-debug.apk
            release/local-fitness-1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
